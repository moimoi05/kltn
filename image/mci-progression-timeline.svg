<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="110.772mm" viewBox="0 0 453.5433 314">
<rect width="100%" height="100%" fill="white"/>
<text x="18" y="17.4" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#263B4D">Chọn 3 MRI trong cửa sổ 18 tháng: baseline ≤ s₁ &lt; s₂ &lt; s₃ ≤ L</text>
<rect x="31" y="40" width="78" height="43" rx="4" fill="#E8F3F8" stroke="#6590A5" stroke-width="1"/>
<text x="70.0" y="59.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#263B4D">Visit 1</text>
<text x="70.0" y="71.4" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#263B4D">s₁</text>
<text x="70" y="98.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#263B4D">MRI + R + C</text>
<polyline points="70,108 70,130" fill="none" stroke="#5C6B79" stroke-width="1.1" stroke-linejoin="round"/>
<polygon points="70,130 72.5,125.0 67.5,125.0" fill="#5C6B79"/>
<rect x="121" y="40" width="78" height="43" rx="4" fill="#E8F3F8" stroke="#6590A5" stroke-width="1"/>
<text x="160.0" y="59.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#263B4D">Visit 2</text>
<text x="160.0" y="71.4" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#263B4D">s₂</text>
<text x="160" y="98.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#263B4D">MRI + R + C</text>
<polyline points="160,108 160,130" fill="none" stroke="#5C6B79" stroke-width="1.1" stroke-linejoin="round"/>
<polygon points="160,130 162.5,125.0 157.5,125.0" fill="#5C6B79"/>
<rect x="211" y="40" width="78" height="43" rx="4" fill="#E8F3F8" stroke="#6590A5" stroke-width="1"/>
<text x="250.0" y="59.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#263B4D">Visit 3</text>
<text x="250.0" y="71.4" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#263B4D">s₃ = p</text>
<text x="250" y="98.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#263B4D">MRI + R + C</text>
<polyline points="250,108 250,130" fill="none" stroke="#5C6B79" stroke-width="1.1" stroke-linejoin="round"/>
<polygon points="250,130 252.5,125.0 247.5,125.0" fill="#5C6B79"/>
<polyline points="18,135 437,135" fill="none" stroke="#5C6B79" stroke-width="1.1" stroke-linejoin="round"/>
<polygon points="437,135 432.0,132.5 432.0,137.5" fill="#5C6B79"/>
<polyline points="25,128 25,143" fill="none" stroke="#5C6B79" stroke-width="1.1" stroke-linejoin="round"/>
<text x="18" y="156.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#263B4D">Baseline</text>
<polyline points="250,130 250,143" fill="none" stroke="#5C6B79" stroke-width="1.5" stroke-linejoin="round"/>
<text x="250" y="156.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle" fill="#263B4D">Dự đoán tại p</text>
<polyline points="332,112 332,178" fill="none" stroke="#5C6B79" stroke-width="1.1" stroke-linejoin="round" stroke-dasharray="4 3"/>
<text x="327" y="190.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="end" fill="#263B4D">L = baseline + 18 tháng</text>
<rect x="352" y="40" width="87" height="45" rx="4" fill="#EEF0F2" stroke="#77838F" stroke-width="1"/>
<text x="395.5" y="60.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#263B4D">Tiến triển*</text>
<text x="395.5" y="72.4" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#263B4D">Sau L</text>
<rect x="352" y="207" width="87" height="45" rx="4" fill="#EEF0F2" stroke="#77838F" stroke-width="1"/>
<text x="395.5" y="227.0" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#263B4D">Kiểm duyệt</text>
<text x="395.5" y="239.4" font-family="Arial, DejaVu Sans, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#263B4D">Sau L</text>
<polyline points="340,135 346,135 346,62 352,62" fill="none" stroke="#5C6B79" stroke-width="1.1" stroke-linejoin="round"/>
<polygon points="352,62 347.0,59.5 347.0,64.5" fill="#5C6B79"/>
<polyline points="340,135 346,135 346,230 352,230" fill="none" stroke="#5C6B79" stroke-width="1.1" stroke-linejoin="round"/>
<polygon points="352,230 347.0,227.5 347.0,232.5" fill="#5C6B79"/>
<polyline points="25,218 25,226 332,226 332,218" fill="none" stroke="#6590A5" stroke-width="1.1" stroke-linejoin="round"/>
<text x="178" y="241.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#263B4D">Điều kiện: không tiến triển sớm đến hết L</text>
<text x="18" y="267.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#263B4D">Thời gian mô hình = (ngày outcome − p) / 365.25; p có thể trùng L.</text>
<text x="18" y="284.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#263B4D">* Endpoint theo MMSE &lt; 24 hoặc CDR-global ≥ 1 sau L.</text>
<text x="18" y="301.98" font-family="Arial, DejaVu Sans, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#263B4D">Clinical ghép gần nhất ±90 ngày; có thể quan sát sau ngày MRI.</text>
</svg>